<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Autonomous Production Exception Agent (APEA) — AI-powered production exception management platform." />
    <title>APEA — Autonomous Production Exception Agent</title>
    <script>
      // Theme bootstrap to prevent flash of incorrect theme.
      (function () {
        try {
          var stored = localStorage.getItem("apea-theme");
          var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          var effective = stored === "dark" || (!stored && prefersDark) || stored === "system" && prefersDark ? "dark" : "light";
          if (effective === "dark") document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
